<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="marasyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="110" fill="url(#marasyBg)"/>
  
  <!-- Outer glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Security Shield -->
  <path d="M256 75 L395 135 C395 265 330 375 256 425 C182 375 117 265 117 135 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Anchor / Security Crest symbol -->
  <!-- Anchor crown/ring -->
  <circle cx="256" cy="165" r="22" fill="none" stroke="#ffffff" stroke-width="10"/>
  <!-- Central pillar -->
  <line x1="256" y1="187" x2="256" y2="335" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="210" y1="220" x2="302" y2="220" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- Anchor curved flukes with arrow heads -->
  <path d="M180 275 C180 340 332 340 332 275" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Stylized M lettermark inside -->
  <path d="M220 375 L238 345 L256 365 L274 345 L292 375" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
